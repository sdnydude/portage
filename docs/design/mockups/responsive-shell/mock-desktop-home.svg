<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Helvetica, Arial, sans-serif">
  <!-- Desktop 1440x900 — Home, sidebar COLLAPSED to 72px icon rail -->
  <rect width="1440" height="900" fill="#F5F2EB"/>

  <!-- Collapsed rail 72px -->
  <rect width="72" height="900" fill="#FFFFFF"/>
  <line x1="72" y1="0" x2="72" y2="900" stroke="#D6D3CE"/>
  <text x="26" y="40" font-size="20" font-weight="700" fill="#2D2A26">P</text>

  <rect x="14" y="64" width="44" height="44" rx="16" fill="#F77E2D"/>
  <circle cx="36" cy="86" r="9" fill="none" stroke="#FFFFFF" stroke-width="2"/>

  <g>
    <rect x="14" y="128" width="44" height="40" rx="12" fill="#EFEBE1"/>
    <circle cx="36" cy="148" r="8" fill="none" stroke="#2D2A26" stroke-width="2.2"/>
    <rect x="28" y="184" width="16" height="16" rx="3" fill="none" stroke="#4A4742" stroke-width="1.8"/>
    <rect x="28" y="228" width="16" height="16" rx="3" fill="none" stroke="#4A4742" stroke-width="1.8"/>
    <circle cx="36" cy="280" r="8" fill="none" stroke="#0D7377" stroke-width="2"/>
    <rect x="28" y="316" width="16" height="14" rx="3" fill="none" stroke="#4A4742" stroke-width="1.8"/>
    <circle cx="30" cy="368" r="1.8" fill="#4A4742"/><circle cx="37" cy="368" r="1.8" fill="#4A4742"/><circle cx="44" cy="368" r="1.8" fill="#4A4742"/>
  </g>
  <path d="M30 862 l8 8 -8 8" fill="none" stroke="#A3A3A3" stroke-width="2"/>

  <!-- Top bar -->
  <line x1="72" y1="64" x2="1440" y2="64" stroke="#D6D3CE"/>
  <text x="104" y="39" font-size="18" font-weight="600" fill="#2D2A26">Home</text>
  <rect x="480" y="14" width="560" height="36" rx="16" fill="#FFFFFF" stroke="#D6D3CE"/>
  <circle cx="504" cy="32" r="7" fill="none" stroke="#0D7377" stroke-width="2"/>
  <text x="520" y="37" font-size="13" fill="#A3A3A3">Ask Porter…</text>
  <rect x="1268" y="18" width="28" height="28" rx="9" fill="none" stroke="#4A4742" stroke-width="1.6"/>
  <circle cx="1330" cy="32" r="13" fill="none" stroke="#4A4742" stroke-width="1.6"/>
  <circle cx="1386" cy="32" r="16" fill="#0D7377"/>
  <text x="1381" y="37" font-size="14" font-weight="700" fill="#FFFFFF">S</text>

  <!-- Porter hero (dark graphite, teal orb) — spans content-container -->
  <g transform="translate(196,92)">
    <rect width="1120" height="240" rx="24" fill="#262A2D"/>
    <rect width="1120" height="240" rx="24" fill="url(#heroGrad)"/>
    <circle cx="560" cy="96" r="36" fill="#0B6360"/>
    <circle cx="560" cy="96" r="48" fill="none" stroke="#119AA0" stroke-opacity="0.5" stroke-width="2"/>
    <text x="560" y="176" font-size="18" font-weight="600" fill="#EEF6F5" text-anchor="middle">Good evening, Stephen</text>
    <text x="560" y="200" font-size="13" fill="#9FC9C8" text-anchor="middle">Ask Porter anything about your inventory</text>
  </g>
  <defs>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262A2D"/><stop offset="1" stop-color="#15181B"/>
    </linearGradient>
  </defs>

  <!-- Stat cards row -->
  <g transform="translate(196,356)" font-size="13">
    <rect width="264" height="96" rx="16" fill="#FFFFFF" stroke="#D6D3CE"/>
    <text x="20" y="34" fill="#4A4742">Items</text>
    <text x="20" y="68" font-size="24" font-weight="700" fill="#2D2A26">128</text>

    <rect x="286" width="264" height="96" rx="16" fill="#FFFFFF" stroke="#D6D3CE"/>
    <text x="306" y="34" fill="#4A4742">Active listings</text>
    <text x="306" y="68" font-size="24" font-weight="700" fill="#2D2A26">34</text>

    <rect x="572" width="264" height="96" rx="16" fill="#FFFFFF" stroke="#D6D3CE"/>
    <text x="592" y="34" fill="#4A4742">Sold this month</text>
    <text x="592" y="68" font-size="24" font-weight="700" fill="#0F9D58">$1,240</text>

    <rect x="858" width="262" height="96" rx="16" fill="#FFFFFF" stroke="#D6D3CE"/>
    <text x="878" y="34" fill="#4A4742">Unlisted value</text>
    <text x="878" y="68" font-size="24" font-weight="700" fill="#C9621B">$3,860</text>
  </g>

  <!-- Recent items strip -->
  <text x="196" y="502" font-size="15" font-weight="600" fill="#2D2A26">Recent items</text>
  <g transform="translate(196,518)">
    <rect width="264" height="200" rx="16" fill="#FFFFFF" stroke="#D6D3CE"/>
    <rect x="1" y="1" width="262" height="120" rx="15" fill="#EFEBE1"/>
    <rect x="16" y="136" width="160" height="12" rx="4" fill="#2D2A26" fill-opacity="0.8"/>
    <rect x="16" y="158" width="90" height="10" rx="4" fill="#A3A3A3"/>

    <rect x="286" width="264" height="200" rx="16" fill="#FFFFFF" stroke="#D6D3CE"/>
    <rect x="287" y="1" width="262" height="120" rx="15" fill="#EFEBE1"/>
    <rect x="302" y="136" width="140" height="12" rx="4" fill="#2D2A26" fill-opacity="0.8"/>
    <rect x="302" y="158" width="100" height="10" rx="4" fill="#A3A3A3"/>

    <rect x="572" width="264" height="200" rx="16" fill="#FFFFFF" stroke="#D6D3CE"/>
    <rect x="573" y="1" width="262" height="120" rx="15" fill="#EFEBE1"/>
    <rect x="588" y="136" width="150" height="12" rx="4" fill="#2D2A26" fill-opacity="0.8"/>
    <rect x="588" y="158" width="84" height="10" rx="4" fill="#A3A3A3"/>

    <rect x="858" width="262" height="200" rx="16" fill="#FFFFFF" stroke="#D6D3CE"/>
    <rect x="859" y="1" width="260" height="120" rx="15" fill="#EFEBE1"/>
    <rect x="874" y="136" width="150" height="12" rx="4" fill="#2D2A26" fill-opacity="0.8"/>
    <rect x="874" y="158" width="84" height="10" rx="4" fill="#A3A3A3"/>
  </g>

  <text x="196" y="762" font-size="11" fill="#A3A3A3">Sidebar shown collapsed (72px icon rail) — toggle persists per user</text>
</svg>

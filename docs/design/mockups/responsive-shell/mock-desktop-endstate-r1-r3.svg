      <rect width="120" height="26" rx="13" fill="none" stroke="#0D7377"/>
      <text x="14" y="17" fill="#0D7377">Reprice to $249</text>
      <rect x="128" width="110" height="26" rx="13" fill="none" stroke="#0D7377"/>
      <text x="142" y="17" fill="#0D7377">Open listing</text>
    </g>
    <!-- history -->

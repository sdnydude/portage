      <rect x="14" y="30" width="160" height="8" rx="4" fill="#4A4742"/>
      <rect x="48" y="66" width="240" height="36" rx="14" fill="#E2F0F0"/>
      <rect x="62" y="80" width="200" height="8" rx="4" fill="#0A4A47"/>
      <rect width="240" height="68" y="116" rx="14" fill="#EFEBE1"/>
      <rect x="14" y="130" width="210" height="8" rx="4" fill="#4A4742"/>
      <rect x="14" y="146" width="190" height="8" rx="4" fill="#4A4742"/>
      <rect x="14" y="162" width="140" height="8" rx="4" fill="#4A4742"/>
    </g>
    <!-- action pills -->

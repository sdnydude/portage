        <rect x="8" y="8" width="48" height="48" rx="8" fill="#EFEBE1"/>
        <rect x="68" y="16" width="170" height="11" rx="4" fill="#2D2A26"/>
        <rect x="68" y="38" width="90" height="9" rx="4" fill="#4A4742"/>

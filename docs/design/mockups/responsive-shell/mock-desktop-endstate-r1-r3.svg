        <rect x="8" y="8" width="48" height="48" rx="8" fill="#EFEBE1"/>
        <rect x="68" y="16" width="145" height="11" rx="4" fill="#2D2A26" fill-opacity="0.8"/>
        <rect x="68" y="38" width="75" height="9" rx="4" fill="#A3A3A3"/>

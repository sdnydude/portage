      <text x="356" y="239" font-size="14" font-weight="700" fill="#2D2A26">$249.00</text>
    </g>

    <!-- COMPS widget -->
    <g transform="translate(24,452)">
      <rect width="632" height="200" rx="16" fill="#E6F4EE" fill-opacity="0.5" stroke="#D6D3CE"/>
      <text x="20" y="30" font-size="14" font-weight="600" fill="#2D2A26">Comps — sold listings</text>

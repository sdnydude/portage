      <g transform="translate(20,66)" font-size="11">
        <rect width="592" height="34" rx="8" fill="#FFFFFF" stroke="#D6D3CE"/>
        <rect x="10" y="12" width="220" height="9" rx="4" fill="#4A4742"/>
        <text x="540" y="22" font-weight="700" fill="#0F9D58">$255</text>
        <rect y="42" width="592" height="34" rx="8" fill="#FFFFFF" stroke="#D6D3CE"/>
        <rect x="10" y="54" width="240" height="9" rx="4" fill="#4A4742"/>
        <text x="540" y="64" font-weight="700" fill="#0F9D58">$249</text>

  <!-- Phase labels -->
  <g font-size="11" font-weight="700">
    <rect x="84" y="76" width="44" height="20" rx="10" fill="#2D2A26"/>
    <text x="94" y="90" fill="#FFFFFF">R0</text>
    <rect x="240" y="76" width="44" height="20" rx="10" fill="#F77E2D"/>
    <text x="250" y="90" fill="#FFFFFF">R1</text>
    <rect x="444" y="76" width="44" height="20" rx="10" fill="#F77E2D"/>
    <text x="454" y="90" fill="#FFFFFF">R1</text>
    <rect x="1124" y="76" width="44" height="20" rx="10" fill="#0D7377"/>
    <text x="1134" y="90" fill="#FFFFFF">R3</text>

<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="Helvetica, Arial, sans-serif">
  <!-- iPhone 390x844 — Settings/Help (NON-TAB page): no tab bar, compact minimized bar bottom-center -->
  <rect width="390" height="844" fill="#F5F2EB"/>

  <!-- Back header -->
  <rect width="390" height="56" fill="#F5F2EB" fill-opacity="0.95"/>
  <line x1="0" y1="56" x2="390" y2="56" stroke="#D6D3CE"/>
  <path d="M24 20 l-8 8 8 8" fill="none" stroke="#2D2A26" stroke-width="2"/>
  <text x="44" y="34" font-size="17" font-weight="600" fill="#2D2A26">Help &amp; Support</text>

  <!-- Tutorials card -->
  <g transform="translate(16,76)">
    <rect width="358" height="72" rx="16" fill="#FFFFFF" stroke="#D6D3CE"/>
    <text x="16" y="30" font-size="14" font-weight="600" fill="#2D2A26">Tutorials</text>
    <text x="16" y="52" font-size="12" fill="#4A4742">Step-by-step walkthroughs of every part of Portage.</text>
  </g>

  <!-- Contact card -->
  <g transform="translate(16,164)">
    <rect width="358" height="88" rx="16" fill="#FFFFFF" stroke="#D6D3CE"/>
    <text x="16" y="30" font-size="14" font-weight="600" fill="#2D2A26">Contact Support</text>
    <text x="16" y="54" font-size="13" fill="#0D7377">support@digitalharmonyai.com</text>
    <text x="16" y="74" font-size="11" fill="#4A4742">We typically respond within 24 hours.</text>
  </g>

  <!-- FAQ list -->
  <text x="20" y="290" font-size="13" font-weight="600" fill="#2D2A26">Frequently Asked Questions</text>
  <g transform="translate(16,304)" font-size="13" fill="#2D2A26">
    <rect width="358" height="56" rx="16" fill="#FFFFFF" stroke="#D6D3CE"/>
    <text x="16" y="33">How does scanning work?</text>
    <path d="M334 24 l6 8 6-8" fill="none" stroke="#A3A3A3" stroke-width="2"/>

    <rect y="68" width="358" height="56" rx="16" fill="#FFFFFF" stroke="#D6D3CE"/>
    <text x="16" y="101">Which marketplaces are supported?</text>
    <path d="M334 92 l6 8 6-8" fill="none" stroke="#A3A3A3" stroke-width="2"/>

    <rect y="136" width="358" height="56" rx="16" fill="#FFFFFF" stroke="#D6D3CE"/>
    <text x="16" y="169">How do shipping labels work?</text>
    <path d="M334 160 l6 8 6-8" fill="none" stroke="#A3A3A3" stroke-width="2"/>

    <rect y="204" width="358" height="56" rx="16" fill="#FFFFFF" stroke="#D6D3CE"/>
    <text x="16" y="237">What does my plan include?</text>
    <path d="M334 228 l6 8 6-8" fill="none" stroke="#A3A3A3" stroke-width="2"/>
  </g>

  <!-- App info -->
  <text x="195" y="620" font-size="11" fill="#A3A3A3" text-anchor="middle">Portage v1.0.0</text>
  <text x="195" y="638" font-size="11" fill="#A3A3A3" text-anchor="middle">Digital Harmony Group</text>

  <!-- COMPACT MINIMIZED TAB BAR — centered floating pill, icon-only, never fully absent per HIG -->
  <g transform="translate(80,768)">
    <rect width="230" height="48" rx="16" fill="#F5F2EB" fill-opacity="0.72" stroke="#FFFFFF" stroke-opacity="0.45"/>
    <rect width="230" height="48" rx="16" fill="#FFFFFF" fill-opacity="0.25"/>
    <g fill="none" stroke="#4A4742">
      <circle cx="21" cy="24" r="6" stroke-width="1.3"/>
      <rect x="51" y="18" width="11" height="11" rx="2" stroke="#2D2A26" stroke-width="1.5"/>
      <rect x="84" y="18" width="11" height="11" rx="2" stroke-width="1.3"/>
      <circle cx="173" cy="24" r="6" stroke="#0D7377" stroke-width="1.4"/>
      <rect x="203" y="18" width="11" height="10" rx="2" stroke-width="1.3"/>
    </g>
    <!-- Scan -->
    <circle cx="115" cy="24" r="14" fill="#F77E2D"/>
    <circle cx="115" cy="24" r="5" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
  </g>
  <text x="318" y="796" font-size="10" fill="#A3A3A3">← compact bar: never fully absent (HIG) — icon-only, direct tap nav</text>

  <!-- Home indicator -->
  <rect x="128" y="832" width="134" height="5" rx="2.5" fill="#2D2A26" fill-opacity="0.3"/>
</svg>

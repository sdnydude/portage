name: Claude Review

on:
  pull_request:
    types: [opened, synchronize]

# Superseded pushes cancel the in-flight review — one paid review per head SHA.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request diff for:
            - Correctness bugs (state races, error paths, edge cases)
            - Silent failures (swallowed errors, fallbacks masking problems)
            - Security issues (input validation, auth, injection)
            - Project-convention violations (see CLAUDE.md)

            Only report findings you are confident are real — no style nits,
            no speculation. If the diff is clean, say so in one sentence.
            Use inline comments for line-specific issues; one summary comment
            via gh pr comment with a verdict line at the top.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 12
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

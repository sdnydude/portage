name: Claude Review

# On-demand only (decision 2026-07-11): local /code-review is the standard
# pre-PR step; CodeRabbit is the always-on CI reviewer. Trigger this by adding
# the `claude-review` label to a PR, or manually via workflow_dispatch.
#
# FORK POLICY (deferral 223b0419, 2026-08-19): a labeled pull_request from a
# FORK is refused by the first step BEFORE checkout — self-hosted runner +
# ANTHROPIC_API_KEY never see fork code. The job-level label gate stays (this
# is not a required check, so skip-vs-fail does not matter here).
# workflow_dispatch against a fork PR number is exempt (write access needed).
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true

# Superseded pushes cancel the in-flight review — one paid review per head SHA.
concurrency:
  group: claude-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'claude-review'
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Refuse fork PRs (self-hosted runner)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Fork PRs do not run on the self-hosted runner. Maintainer: push the branch to contrib/<name> and open a same-repo PR."
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}

            Review this pull request diff for:
            - Correctness bugs (state races, error paths, edge cases)
            - Silent failures (swallowed errors, fallbacks masking problems)
            - Security issues (input validation, auth, injection)
            - Project-convention violations (see CLAUDE.md)

            Only report findings you are confident are real — no style nits,
            no speculation. If the diff is clean, say so in one sentence.
            Use inline comments for line-specific issues; one summary comment
            via gh pr comment with a verdict line at the top.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 12
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

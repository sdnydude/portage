name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build shared
        run: npm run build -w packages/shared

      - name: Typecheck shared
        run: npm run typecheck -w packages/shared

      - name: Typecheck API
        run: npm run typecheck -w apps/api

      - name: Typecheck web
        run: npm run typecheck -w apps/web

      - name: Lint web
        run: npm run lint -w apps/web
      - name: Lint plugin-load canary (P6)
        # A plugin that fails to load lints "clean" with zero rules; prove each
        # stack member contributes at least one active rule to a real file.
        run: |
          cd apps/web
          npx eslint --print-config src/app/layout.tsx > /tmp/eslint-config.json
          node -e '
            const c = JSON.parse(require("fs").readFileSync("/tmp/eslint-config.json", "utf8"));
            const active = Object.entries(c.rules || {}).filter(([, v]) => (Array.isArray(v) ? v[0] : v) !== "off" && (Array.isArray(v) ? v[0] : v) !== 0);
            for (const p of ["@eslint-react/", "react-hooks/", "@next/next/", "jsx-a11y/", "@typescript-eslint/", "import-x/"]) {
              if (!active.some(([k]) => k.startsWith(p))) { console.error("no active rules from " + p); process.exit(1); }
            }
            console.log("eslint stack active:", active.length, "rules");
          '

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint-typecheck

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: portage
          POSTGRES_PASSWORD: portage
          POSTGRES_DB: portage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portage"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build shared
        run: npm run build -w packages/shared

      - name: Run API tests
        run: npm run test -w apps/api
        env:
          DATABASE_URL: postgresql://portage:portage@localhost:5432/portage
          JWT_SECRET: ci-test-secret-that-is-at-least-32-chars
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

      # P4: tutorial screenshots are published assets — every step's PNG must
      # exist, be 780x1688, and not be a blank frame (scripts/check-tutorial-captures.ts).
      - name: Check tutorial captures
        run: npm run check:tutorials -w apps/web

      - name: Run web unit tests
        run: npm run test -w apps/web

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-typecheck

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build shared
        run: npm run build -w packages/shared

      - name: Build API
        run: npm run build -w apps/api

      - name: Build web
        run: npm run build -w apps/web

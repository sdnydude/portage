version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # P6 (2026-08-27): typescript-eslint peers cap TS at <6.1 until TS 7.1 ships a compiler API
      - dependency-name: typescript
        versions: [">=6.1"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # P6 (2026-08-27): typescript-eslint peers cap TS at <6.1 until TS 7.1 ships a compiler API
      - dependency-name: typescript
        versions: [">=6.1"]
      # Track the Node 24 LTS runtime (Dockerfiles/CI), not the newest types major
      - dependency-name: "@types/node"
        versions: [">=25"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # P6 (2026-08-27): typescript-eslint peers cap TS at <6.1 until TS 7.1 ships a compiler API
      - dependency-name: typescript
        versions: [">=6.1"]
      # web stays on @types/node 25 (vitest 4 peer); ignore the next major only
      - dependency-name: "@types/node"
        versions: [">=26"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

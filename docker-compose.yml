services:
  portage-db:
    image: postgres:15-alpine
    container_name: portage-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5436:5432"
    environment:
      POSTGRES_USER: portage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portage}
      POSTGRES_DB: portage
    volumes:
      - portage-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portage"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - portage-network

  portage-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: portage-api
    restart: unless-stopped
    ports:
      - "8016:8016"
    environment:
      NODE_ENV: production
      API_PORT: "8016"
      DATABASE_URL: postgresql://portage:${POSTGRES_PASSWORD:-portage}@portage-db:5432/portage
      REMBG_URL: http://portage-rembg:7000
    env_file:
      - .env
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      portage-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('https').get({hostname:'localhost',port:8016,path:'/health',rejectUnauthorized:false},r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8016"
      prometheus.io/path: "/metrics"
    networks:
      - portage-network
      - dhg-network

  portage-app:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: portage-app
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
    depends_on:
      portage-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - portage-network

  portage-rembg:
    image: danielgatis/rembg:latest
    container_name: portage-rembg
    restart: unless-stopped
    command: s --port 7000 --no-ui
    ports:
      - "7000:7000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:7000/api')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - portage-network

  dhg-stt:
    image: hwdsl2/whisper-live-server:latest
    container_name: dhg-stt
    restart: unless-stopped
    ports:
      - "8018:8000"
    environment:
      WHISPERLIVE_MODEL: large-v3-turbo
      WHISPERLIVE_REST_PORT: "8000"
      WHISPERLIVE_PORT: "9090"
      WHISPERLIVE_USE_VAD: "true"
      WHISPERLIVE_MAX_CLIENTS: "4"
    volumes:
      - dhg-stt-models:/var/lib/whisper-live
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/docs > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - portage-network

  dhg-tts:
    image: romheat/chatterbox:latest
    container_name: dhg-tts
    restart: unless-stopped
    ports:
      - "8019:8000"
    environment:
      CHATTERBOX_DEVICE: cpu
      CHATTERBOX_MODEL: turbo
      HUGGING_FACE_HUB_TOKEN: ${HUGGINGFACE_API_KEY}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/docs > /dev/null || curl -sf http://localhost:8000/health > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - portage-network

volumes:
  portage-pgdata:
  dhg-stt-models:

networks:
  portage-network:
    driver: bridge
  dhg-network:
    external: true
    name: dhgaifactory35_dhg-network

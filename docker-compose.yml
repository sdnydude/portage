services:
  portage-db:
    image: postgres:15-alpine
    container_name: portage-db
    ports:
      - "127.0.0.1:5436:5432"
    environment:
      POSTGRES_USER: portage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portage}
      POSTGRES_DB: portage
    volumes:
      - portage-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portage"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - portage-network

  portage-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: portage-api
    ports:
      - "8016:8016"
    environment:
      NODE_ENV: production
      API_PORT: "8016"
      DATABASE_URL: postgresql://portage:${POSTGRES_PASSWORD:-portage}@portage-db:5432/portage
      REMBG_URL: http://portage-rembg:7000
    env_file:
      - .env
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      portage-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('https').get({hostname:'localhost',port:8016,path:'/health',rejectUnauthorized:false},r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8016"
      prometheus.io/path: "/metrics"
    networks:
      - portage-network
      - dhg-network

  portage-app:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: portage-app
    ports:
      - "3002:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
    depends_on:
      portage-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - portage-network

  portage-rembg:
    image: danielgatis/rembg:latest
    container_name: portage-rembg
    command: s --port 7000 --no-ui
    ports:
      - "7000:7000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:7000/api')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - portage-network

volumes:
  portage-pgdata:

networks:
  portage-network:
    driver: bridge
  dhg-network:
    external: true
    name: dhgaifactory35_dhg-network

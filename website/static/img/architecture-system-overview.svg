<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1080" viewBox="0 0 1360 1080" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="soTeal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0D7377"/><stop offset="1" stop-color="#0A5A5D"/></linearGradient>
    <linearGradient id="soOrange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F77E2D"/><stop offset="1" stop-color="#E0631A"/></linearGradient>
    <linearGradient id="soGray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8A857D"/><stop offset="1" stop-color="#6E6A63"/></linearGradient>
    <linearGradient id="soInk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A3836"/><stop offset="1" stop-color="#2D2A26"/></linearGradient>
    <filter id="soShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#2D2A26" flood-opacity="0.14"/>
    </filter>
    <marker id="soArrow" markerWidth="11" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L11 4 L0 8 Z" fill="#4A4742"/>
    </marker>
    <marker id="soArrowTeal" markerWidth="11" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L11 4 L0 8 Z" fill="#0D7377"/>
    </marker>
    <marker id="soArrowOrange" markerWidth="11" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L11 4 L0 8 Z" fill="#E0631A"/>
    </marker>
    <style>
      text{font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif}
      .lbl{fill:#2D2A26;font-size:13px}
      .sub{fill:#4A4742;font-size:13px}
      .mono{font-weight:600;letter-spacing:.1px}
      .hd{fill:#FFFFFF;font-weight:600;font-size:14px;letter-spacing:.1px}
      .layer{font-weight:700;font-size:14px;letter-spacing:.06em;fill:#4A4742}
      .edge{fill:#4A4742;font-size:12px;font-weight:600}
    </style>
  </defs>

  <!-- Page background -->
  <rect width="1360" height="1080" fill="#F5F2EB"/>
  <rect x="0" y="0" width="1360" height="6" fill="#F77E2D"/>

  <!-- Title -->
  <text x="48" y="48" font-size="27" font-weight="800" letter-spacing="-.2px" fill="#2D2A26">Portage — System Overview</text>
  <text x="48" y="74" class="sub">npm workspaces monorepo (apps/api · apps/web · packages/shared) — docker compose stack on g700data1 — 2026-07-17</text>

  <!-- Legend -->
  <g transform="translate(960,26)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#0D7377"/>
    <text x="20" y="11" class="sub">Portage compose service</text>
    <rect x="210" y="0" width="14" height="14" rx="3" fill="#F77E2D"/>
    <text x="230" y="11" class="sub">Cloudflare</text>
    <rect x="0" y="22" width="14" height="14" rx="3" fill="#8A857D"/>
    <text x="20" y="33" class="sub">External / outside compose</text>
    <rect x="210" y="22" width="14" height="14" rx="3" fill="url(#soInk)"/>
    <text x="230" y="33" class="sub">AI subsystem</text>
  </g>

  <!-- CLIENT zone -->
  <rect x="40" y="96" width="1280" height="214" rx="12" fill="#EFEBE2" stroke="#D6D3CE" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="60" y="120" class="layer">CLIENT</text>

  <!-- Next.js PWA card -->
  <rect x="64" y="136" width="780" height="158" rx="10" fill="#FFFFFF" stroke="#0D7377" stroke-width="2" filter="url(#soShadow)"/>
  <rect x="64" y="136" width="780" height="28" rx="10" fill="url(#soTeal)"/>
  <rect x="64" y="155" width="780" height="9" fill="#0A5A5D"/>
  <text x="454" y="155" text-anchor="middle" class="hd">portage-app — Next.js 16 PWA · :3002</text>
  <text x="80" y="186" class="lbl">React 19 · Tailwind v4 · mobile-first PWA</text>
  <text x="80" y="208" class="sub">AppShell responsive shell — desktop sidebar + top bar (lg+), floating glass tab bar (mobile)</text>
  <text x="80" y="230" class="sub">5 tabs: Home · Inventory · Listings · Porter · Orders + center Scan — More via avatar menu</text>
  <text x="80" y="252" class="sub mono">hooks: use-listing-flow · use-items · use-listings · use-orders · use-porter-stream</text>
  <text x="80" y="274" class="sub mono">use-camera · use-drafts · use-bg-removal · use-enhance · use-messages · use-auth</text>

  <!-- Cloudflare Access card -->
  <rect x="876" y="136" width="420" height="158" rx="10" fill="#FFFFFF" stroke="#C4722A" stroke-width="2" filter="url(#soShadow)"/>
  <rect x="876" y="136" width="420" height="28" rx="10" fill="url(#soOrange)"/>
  <rect x="876" y="155" width="420" height="9" fill="#E0631A"/>
  <text x="1086" y="155" text-anchor="middle" class="hd">Cloudflare Access — identity provider</text>
  <text x="892" y="186" class="lbl">No passwords · no refresh tokens</text>
  <text x="892" y="208" class="sub mono">Cf-Access-Jwt-Assertion header on every request</text>
  <text x="892" y="230" class="sub">API verifies header vs team JWKS, auto-provisions</text>
  <text x="892" y="252" class="sub">user row, mints 15-min internal JWT (lib/jwt.ts)</text>
  <text x="892" y="274" class="sub">Client re-exchanges via GET /auth/session on expiry</text>

  <!-- Access -> app edge -->
  <path d="M876 215 L852 215" fill="none" stroke="#E0631A" stroke-width="2" marker-end="url(#soArrowOrange)"/>

  <!-- app -> API -->
  <path d="M454 294 L454 364" fill="none" stroke="#0D7377" stroke-width="2" marker-end="url(#soArrowTeal)"/>
  <text x="466" y="330" class="edge">HTTPS · Bearer internal JWT (15 m)</text>

  <!-- API zone -->
  <rect x="40" y="330" width="1280" height="330" rx="12" fill="#EFEBE2" stroke="#D6D3CE" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="60" y="354" class="layer">API</text>

  <!-- Express core card -->
  <rect x="64" y="372" width="360" height="266" rx="10" fill="#FFFFFF" stroke="#0D7377" stroke-width="2" filter="url(#soShadow)"/>
  <rect x="64" y="372" width="360" height="28" rx="10" fill="url(#soTeal)"/>
  <rect x="64" y="391" width="360" height="9" fill="#0A5A5D"/>
  <text x="244" y="391" text-anchor="middle" class="hd">portage-api — Express 5 · :8016</text>
  <text x="80" y="422" class="lbl">TypeScript · Drizzle ORM · Zod · pino</text>
  <text x="80" y="444" class="sub">JWT auth middleware · roles: user | admin</text>
  <text x="80" y="470" class="sub mono">/auth</text><text x="230" y="470" class="sub mono">/porter</text>
  <text x="80" y="491" class="sub mono">/images</text><text x="230" y="491" class="sub mono">/drafts</text>
  <text x="80" y="512" class="sub mono">/scan</text><text x="230" y="512" class="sub mono">/messages</text>
  <text x="80" y="533" class="sub mono">/items</text><text x="230" y="533" class="sub mono">/admin</text>
  <text x="80" y="554" class="sub mono">/listings</text><text x="230" y="554" class="sub mono">/billing</text>
  <text x="80" y="575" class="sub mono">/orders</text><text x="230" y="575" class="sub mono">/dashboard</text>
  <text x="80" y="596" class="sub mono">/seller-profile</text><text x="230" y="596" class="sub mono">/users/me</text>
  <text x="80" y="617" class="sub mono">/marketplace/ebay · /marketplace/reverb</text>

  <!-- Marketplace adapters card -->
  <rect x="448" y="372" width="424" height="266" rx="10" fill="#FFFFFF" stroke="#C4722A" stroke-width="2" filter="url(#soShadow)"/>
  <rect x="448" y="372" width="424" height="28" rx="10" fill="url(#soOrange)"/>
  <rect x="448" y="391" width="424" height="9" fill="#E0631A"/>
  <text x="660" y="391" text-anchor="middle" class="hd">Marketplace adapters — shared contract</text>
  <text x="464" y="422" class="lbl">eBay — Trade-First lifecycle (Trading API, XML):</text>
  <text x="464" y="446" class="sub mono">AddFixedPriceItem · ReviseFixedPriceItem</text>
  <text x="464" y="468" class="sub mono">ReviseInventoryStatus · EndFixedPriceItem · GetItem</text>
  <text x="464" y="492" class="sub">Inline shipping terms — no Business Policies</text>
  <text x="464" y="514" class="sub">Insert-first idempotency (listings.idempotency_key)</text>
  <text x="464" y="538" class="sub">Fulfillment REST (orders) · Taxonomy (categories)</text>
  <text x="464" y="566" class="lbl">Reverb — per-user PAT · api.reverb.com</text>
  <text x="464" y="592" class="sub">Tokens AES-256-GCM at rest (token-manager.ts)</text>
  <text x="464" y="616" class="sub">Etsy parked 2026-07 — adapter removed</text>

  <!-- AI subsystem card -->
  <rect x="896" y="372" width="400" height="266" rx="10" fill="#FFFFFF" stroke="#2D2A26" stroke-width="2" filter="url(#soShadow)"/>
  <rect x="896" y="372" width="400" height="28" rx="10" fill="url(#soInk)"/>
  <rect x="896" y="391" width="400" height="9" fill="#2D2A26"/>
  <text x="1096" y="391" text-anchor="middle" class="hd">AI subsystem</text>
  <text x="912" y="422" class="lbl">Vision — VISION_PROVIDERS chain (lib/ai-client.ts)</text>
  <text x="912" y="444" class="sub">Gemini 2.5 primary → Claude fallback (prod)</text>
  <text x="912" y="470" class="lbl">Porter — SSE stream · POST /porter/stream</text>
  <text x="912" y="492" class="sub">CHAT_PROVIDERS chain (Claude Sonnet) · 3 tools:</text>
  <text x="912" y="514" class="sub mono">search_inventory · get_inventory_stats</text>
  <text x="912" y="536" class="sub mono">suggest_listing</text>
  <text x="912" y="562" class="lbl">Photo tools — Sharp enhance / rotate / crop</text>
  <text x="912" y="584" class="sub">BG removal via rembg: POST /images/remove-bg</text>
  <text x="912" y="610" class="lbl">Prepare listing — AI fields + comps pricing</text>
  <text x="912" y="632" class="sub mono">POST /items/:id/prepare-listing</text>

  <!-- API -> data arrows -->
  <path d="M244 638 L244 712" fill="none" stroke="#0D7377" stroke-width="2" marker-end="url(#soArrowTeal)"/>
  <text x="256" y="672" class="edge">Drizzle / SQL</text>
  <path d="M334 638 L334 690 L820 690 L820 712" fill="none" stroke="#4A4742" stroke-width="2" marker-end="url(#soArrow)"/>
  <text x="560" y="683" class="edge">photo uploads (S3 API)</text>
  <path d="M1146 638 L1146 712" fill="none" stroke="#4A4742" stroke-width="2" marker-end="url(#soArrow)"/>
  <text x="1158" y="672" class="edge">remove-bg</text>
  <path d="M660 638 L660 905 L1048 905 L1048 940" fill="none" stroke="#E0631A" stroke-width="2" marker-end="url(#soArrowOrange)"/>
  <text x="672" y="898" class="edge">OAuth2 (eBay) · PAT (Reverb) · HTTPS</text>

  <!-- DATA & STORAGE zone -->
  <rect x="40" y="680" width="1280" height="212" rx="12" fill="#EFEBE2" stroke="#D6D3CE" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="60" y="704" class="layer">DATA &amp; STORAGE</text>

  <!-- Postgres card -->
  <rect x="64" y="712" width="560" height="160" rx="10" fill="#FFFFFF" stroke="#0D7377" stroke-width="2" filter="url(#soShadow)"/>
  <rect x="64" y="712" width="560" height="28" rx="10" fill="url(#soTeal)"/>
  <rect x="64" y="731" width="560" height="9" fill="#0A5A5D"/>
  <text x="344" y="731" text-anchor="middle" class="hd">portage-db — PostgreSQL 15 · 127.0.0.1:5436</text>
  <text x="80" y="760" class="lbl">Drizzle schema-push (no migration files) — 18 tables:</text>
  <text x="80" y="783" class="sub" font-size="12">users · items · listings · orders · conversations · notifications · faqs</text>
  <text x="80" y="803" class="sub" font-size="12">marketplace_accounts · admin_audit_log · app_settings · stripe_events</text>
  <text x="80" y="823" class="sub" font-size="12">design_survey_responses · design_review_comments · disclaimer_acceptances</text>
  <text x="80" y="843" class="sub" font-size="12">listing_drafts · seller_profiles · ebay_messages · export_tokens</text>
  <text x="80" y="863" class="sub" font-size="12">JSONB: items.photos · items.marketplaceData · orders.shippingAddress</text>

  <!-- R2 card -->
  <rect x="680" y="712" width="290" height="160" rx="10" fill="#FFFFFF" stroke="#C4722A" stroke-width="2" filter="url(#soShadow)"/>
  <rect x="680" y="712" width="290" height="28" rx="10" fill="url(#soOrange)"/>
  <rect x="680" y="731" width="290" height="9" fill="#E0631A"/>
  <text x="825" y="731" text-anchor="middle" class="hd">Cloudflare R2 — photos</text>
  <text x="696" y="760" class="lbl">Bucket: portage-images</text>
  <text x="696" y="784" class="sub">S3 API via @aws-sdk/client-s3</text>
  <text x="696" y="806" class="sub">(lib/storage.ts)</text>
  <text x="696" y="830" class="sub">Item photos — max 24 per item</text>
  <text x="696" y="852" class="sub mono">MAX_PHOTOS_PER_ITEM = 24</text>

  <!-- rembg card -->
  <rect x="994" y="712" width="302" height="160" rx="10" fill="#FFFFFF" stroke="#0D7377" stroke-width="2" filter="url(#soShadow)"/>
  <rect x="994" y="712" width="302" height="28" rx="10" fill="url(#soTeal)"/>
  <rect x="994" y="731" width="302" height="9" fill="#0A5A5D"/>
  <text x="1145" y="731" text-anchor="middle" class="hd">portage-rembg — :7000</text>
  <text x="1010" y="760" class="lbl">Background-removal container</text>
  <text x="1010" y="784" class="sub mono">POST {REMBG_URL}/api/remove</text>
  <text x="1010" y="806" class="sub">Called by POST /images/remove-bg</text>
  <text x="1010" y="830" class="sub">Billing-gated per tier</text>

  <!-- EXTERNAL / ADJACENT zone -->
  <rect x="40" y="912" width="1280" height="118" rx="12" fill="#EFEBE2" stroke="#D6D3CE" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="60" y="936" class="layer">EXTERNAL &amp; ADJACENT</text>

  <!-- portage-graph -->
  <rect x="248" y="944" width="220" height="74" rx="10" fill="#FFFFFF" stroke="#0D7377" stroke-width="2" filter="url(#soShadow)"/>
  <rect x="248" y="944" width="220" height="26" rx="10" fill="url(#soTeal)"/>
  <rect x="248" y="961" width="220" height="9" fill="#0A5A5D"/>
  <text x="358" y="962" text-anchor="middle" class="hd" font-size="13">portage-graph · :8018</text>
  <text x="264" y="990" class="sub" font-size="12">nginx — graphify-out/ code</text>
  <text x="264" y="1008" class="sub" font-size="12">knowledge graph (compose)</text>

  <!-- dhg-docs -->
  <rect x="492" y="944" width="230" height="74" rx="10" fill="#FFFFFF" stroke="#8A857D" stroke-width="2" filter="url(#soShadow)"/>
  <rect x="492" y="944" width="230" height="26" rx="10" fill="url(#soGray)"/>
  <rect x="492" y="961" width="230" height="9" fill="#6E6A63"/>
  <text x="607" y="962" text-anchor="middle" class="hd" font-size="13">dhg-docs · :8017</text>
  <text x="508" y="990" class="sub" font-size="12">nginx — Docusaurus build</text>
  <text x="508" y="1008" class="sub" font-size="12">runs outside this compose file</text>

  <!-- DHG Registry -->
  <rect x="746" y="944" width="230" height="74" rx="10" fill="#FFFFFF" stroke="#8A857D" stroke-width="2" filter="url(#soShadow)"/>
  <rect x="746" y="944" width="230" height="26" rx="10" fill="url(#soGray)"/>
  <rect x="746" y="961" width="230" height="9" fill="#6E6A63"/>
  <text x="861" y="962" text-anchor="middle" class="hd" font-size="13">DHG Registry · :8011</text>
  <text x="762" y="990" class="sub" font-size="12">Separate DHG stack — doc search,</text>
  <text x="762" y="1008" class="sub" font-size="12">session + insight capture</text>

  <!-- Marketplace APIs -->
  <rect x="1000" y="944" width="296" height="74" rx="10" fill="#FFFFFF" stroke="#8A857D" stroke-width="2" filter="url(#soShadow)"/>
  <rect x="1000" y="944" width="296" height="26" rx="10" fill="url(#soGray)"/>
  <rect x="1000" y="961" width="296" height="9" fill="#6E6A63"/>
  <text x="1148" y="962" text-anchor="middle" class="hd" font-size="13">Marketplace APIs (prod)</text>
  <text x="1016" y="990" class="sub" font-size="12">eBay — Trading (XML) · Fulfillment · Taxonomy</text>
  <text x="1016" y="1008" class="sub" font-size="12">Reverb — api.reverb.com (per-user PAT)</text>

  <!-- Footnote -->
  <text x="48" y="1060" class="sub" font-size="12">Secrets: Doppler-synced .env (never committed) · Marketplace tokens encrypted AES-256-GCM at rest · Etsy parked 2026-07 (DB enum value inert)</text>
</svg>

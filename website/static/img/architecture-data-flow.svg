<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1140" viewBox="0 0 1360 1140" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="dfTeal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0D7377"/><stop offset="1" stop-color="#0A5A5D"/></linearGradient>
    <linearGradient id="dfOrange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F77E2D"/><stop offset="1" stop-color="#E0631A"/></linearGradient>
    <linearGradient id="dfInk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A3836"/><stop offset="1" stop-color="#2D2A26"/></linearGradient>
    <filter id="dfShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#2D2A26" flood-opacity="0.14"/>
    </filter>
    <marker id="dfArrow" markerWidth="11" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L11 4 L0 8 Z" fill="#4A4742"/>
    </marker>
    <style>
      text{font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif}
      .lbl{fill:#2D2A26;font-size:13px}
      .sub{fill:#4A4742;font-size:12.5px}
      .mono{font-weight:600;letter-spacing:.1px}
      .hd{fill:#FFFFFF;font-weight:600;font-size:13px;letter-spacing:.1px}
      .flow{font-weight:700;font-size:14px;letter-spacing:.06em;fill:#4A4742}
    </style>
  </defs>

  <!-- Page background -->
  <rect width="1360" height="1140" fill="#F5F2EB"/>
  <rect x="0" y="0" width="1360" height="6" fill="#F77E2D"/>

  <!-- Title -->
  <text x="48" y="48" font-size="27" font-weight="800" letter-spacing="-.2px" fill="#2D2A26">Portage — Core Data Flows</text>
  <text x="48" y="74" class="sub" font-size="13">Four request paths through the stack, per apps/api/src/routes and apps/web/src — 2026-07-17</text>

  <!-- Legend -->
  <g transform="translate(1000,26)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#0D7377"/>
    <text x="20" y="11" class="sub" font-size="13">Portage code path</text>
    <rect x="170" y="0" width="14" height="14" rx="3" fill="#F77E2D"/>
    <text x="190" y="11" class="sub" font-size="13">External service</text>
    <rect x="0" y="22" width="14" height="14" rx="3" fill="url(#dfInk)"/>
    <text x="20" y="33" class="sub" font-size="13">AI / data step</text>
  </g>

  <!-- ════════ FLOW 1 — SCAN ════════ -->
  <rect x="40" y="96" width="1280" height="220" rx="12" fill="#EFEBE2" stroke="#D6D3CE" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="60" y="122" class="flow">FLOW 1 — SCAN → ITEM (camera to inventory)</text>

  <!-- 1.1 capture -->
  <rect x="64" y="146" width="216" height="140" rx="10" fill="#FFFFFF" stroke="#0D7377" stroke-width="2" filter="url(#dfShadow)"/>
  <rect x="64" y="146" width="216" height="26" rx="10" fill="url(#dfTeal)"/>
  <rect x="64" y="163" width="216" height="9" fill="#0A5A5D"/>
  <text x="172" y="164" text-anchor="middle" class="hd">Capture (client)</text>
  <text x="80" y="194" class="sub">ScanFlow + CameraCapture</text>
  <text x="80" y="215" class="sub mono">use-camera hook</text>
  <text x="80" y="236" class="sub">Photo held as File in memory</text>
  <path d="M280 216 L308 216" fill="none" stroke="#4A4742" stroke-width="2" marker-end="url(#dfArrow)"/>

  <!-- 1.2 upload -->
  <rect x="320" y="146" width="216" height="140" rx="10" fill="#FFFFFF" stroke="#0D7377" stroke-width="2" filter="url(#dfShadow)"/>
  <rect x="320" y="146" width="216" height="26" rx="10" fill="url(#dfTeal)"/>
  <rect x="320" y="163" width="216" height="9" fill="#0A5A5D"/>
  <text x="428" y="164" text-anchor="middle" class="hd">POST /images</text>
  <text x="336" y="194" class="sub">Multipart upload (multer)</text>
  <text x="336" y="215" class="sub">Stored via lib/storage.ts</text>
  <text x="336" y="236" class="sub">→ R2 bucket portage-images</text>
  <text x="336" y="257" class="sub">Cap: 24 photos per item</text>
  <path d="M536 216 L564 216" fill="none" stroke="#4A4742" stroke-width="2" marker-end="url(#dfArrow)"/>

  <!-- 1.3 vision -->
  <rect x="576" y="146" width="216" height="140" rx="10" fill="#FFFFFF" stroke="#2D2A26" stroke-width="2" filter="url(#dfShadow)"/>
  <rect x="576" y="146" width="216" height="26" rx="10" fill="url(#dfInk)"/>
  <rect x="576" y="163" width="216" height="9" fill="#2D2A26"/>
  <text x="684" y="164" text-anchor="middle" class="hd">POST /scan/refine</text>
  <text x="592" y="194" class="sub">Vision chain (lib/vision.ts)</text>
  <text x="592" y="215" class="sub mono">VISION_PROVIDERS:</text>
  <text x="592" y="236" class="sub">Gemini 2.5 → Claude (prod)</text>
  <text x="592" y="257" class="sub">Returns item candidates</text>
  <path d="M792 216 L820 216" fill="none" stroke="#4A4742" stroke-width="2" marker-end="url(#dfArrow)"/>

  <!-- 1.4 comps -->
  <rect x="832" y="146" width="216" height="140" rx="10" fill="#FFFFFF" stroke="#C4722A" stroke-width="2" filter="url(#dfShadow)"/>
  <rect x="832" y="146" width="216" height="26" rx="10" fill="url(#dfOrange)"/>
  <rect x="832" y="163" width="216" height="9" fill="#E0631A"/>
  <text x="940" y="164" text-anchor="middle" class="hd">Comps lookup</text>
  <text x="848" y="194" class="sub mono">GET /items/comps/search</text>
  <text x="848" y="215" class="sub">Comparable eBay listings</text>
  <text x="848" y="236" class="sub">for pricing guidance</text>
  <path d="M1048 216 L1076 216" fill="none" stroke="#4A4742" stroke-width="2" marker-end="url(#dfArrow)"/>

  <!-- 1.5 create item -->
  <rect x="1088" y="146" width="216" height="140" rx="10" fill="#FFFFFF" stroke="#0D7377" stroke-width="2" filter="url(#dfShadow)"/>
  <rect x="1088" y="146" width="216" height="26" rx="10" fill="url(#dfTeal)"/>
  <rect x="1088" y="163" width="216" height="9" fill="#0A5A5D"/>
  <text x="1196" y="164" text-anchor="middle" class="hd">POST /items</text>
  <text x="1104" y="194" class="sub">Inventory row created</text>
  <text x="1104" y="215" class="sub mono">items.photos (JSONB)</text>
  <text x="1104" y="236" class="sub">Postgres via Drizzle</text>

  <!-- ════════ FLOW 2 — PUBLISH ════════ -->
  <rect x="40" y="348" width="1280" height="220" rx="12" fill="#EFEBE2" stroke="#D6D3CE" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="60" y="374" class="flow">FLOW 2 — PREPARE → PUBLISH (listing lifecycle)</text>

  <!-- 2.1 prepare -->
  <rect x="64" y="398" width="280" height="140" rx="10" fill="#FFFFFF" stroke="#2D2A26" stroke-width="2" filter="url(#dfShadow)"/>
  <rect x="64" y="398" width="280" height="26" rx="10" fill="url(#dfInk)"/>
  <rect x="64" y="415" width="280" height="9" fill="#2D2A26"/>
  <text x="204" y="416" text-anchor="middle" class="hd">Prepare — AI field generation</text>
  <text x="80" y="446" class="sub mono">POST /items/:id/prepare-listing</text>
  <text x="80" y="467" class="sub">Title · description · pricing from comps</text>
  <text x="80" y="488" class="sub">Seller-profile defaults applied</text>
  <path d="M344 468 L372 468" fill="none" stroke="#4A4742" stroke-width="2" marker-end="url(#dfArrow)"/>

  <!-- 2.2 drafts -->
  <rect x="384" y="398" width="280" height="140" rx="10" fill="#FFFFFF" stroke="#0D7377" stroke-width="2" filter="url(#dfShadow)"/>
  <rect x="384" y="398" width="280" height="26" rx="10" fill="url(#dfTeal)"/>
  <rect x="384" y="415" width="280" height="9" fill="#0A5A5D"/>
  <text x="524" y="416" text-anchor="middle" class="hd">Draft auto-save</text>
  <text x="400" y="446" class="sub mono">use-listing-flow hook</text>
  <text x="400" y="467" class="sub">POST /drafts → listing_drafts table</text>
  <text x="400" y="488" class="sub">GET /drafts restores in-progress work</text>
  <path d="M664 468 L692 468" fill="none" stroke="#4A4742" stroke-width="2" marker-end="url(#dfArrow)"/>

  <!-- 2.3 create + publish -->
  <rect x="704" y="398" width="280" height="140" rx="10" fill="#FFFFFF" stroke="#0D7377" stroke-width="2" filter="url(#dfShadow)"/>
  <rect x="704" y="398" width="280" height="26" rx="10" fill="url(#dfTeal)"/>
  <rect x="704" y="415" width="280" height="9" fill="#0A5A5D"/>
  <text x="844" y="416" text-anchor="middle" class="hd">Create + publish</text>
  <text x="720" y="446" class="sub mono">POST /listings</text>
  <text x="720" y="467" class="sub mono">POST /listings/:id/publish</text>
  <text x="720" y="488" class="sub">Insert-first idempotency:</text>
  <text x="720" y="509" class="sub mono">uq(user_id, idempotency_key)</text>
  <path d="M984 468 L1012 468" fill="none" stroke="#4A4742" stroke-width="2" marker-end="url(#dfArrow)"/>

  <!-- 2.4 marketplace -->
  <rect x="1024" y="398" width="280" height="140" rx="10" fill="#FFFFFF" stroke="#C4722A" stroke-width="2" filter="url(#dfShadow)"/>
  <rect x="1024" y="398" width="280" height="26" rx="10" fill="url(#dfOrange)"/>
  <rect x="1024" y="415" width="280" height="9" fill="#E0631A"/>
  <text x="1164" y="416" text-anchor="middle" class="hd">Marketplace publish</text>
  <text x="1040" y="446" class="sub">eBay Trading (XML):</text>
  <text x="1040" y="467" class="sub mono">AddFixedPriceItem</text>
  <text x="1040" y="488" class="sub">Inline shipping terms</text>
  <text x="1040" y="509" class="sub">Reverb (PAT): create listing</text>

  <!-- ════════ FLOW 3 — ORDER SYNC ════════ -->
  <rect x="40" y="600" width="1280" height="220" rx="12" fill="#EFEBE2" stroke="#D6D3CE" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="60" y="626" class="flow">FLOW 3 — ORDER SYNC (sold → ship)</text>

  <!-- 3.1 trigger -->
  <rect x="64" y="650" width="280" height="140" rx="10" fill="#FFFFFF" stroke="#0D7377" stroke-width="2" filter="url(#dfShadow)"/>
  <rect x="64" y="650" width="280" height="26" rx="10" fill="url(#dfTeal)"/>
  <rect x="64" y="667" width="280" height="9" fill="#0A5A5D"/>
  <text x="204" y="668" text-anchor="middle" class="hd">Sync trigger</text>
  <text x="80" y="698" class="sub mono">use-orders hook</text>
  <text x="80" y="719" class="sub mono">POST /orders/sync</text>
  <path d="M344 720 L372 720" fill="none" stroke="#4A4742" stroke-width="2" marker-end="url(#dfArrow)"/>

  <!-- 3.2 fulfillment -->
  <rect x="384" y="650" width="280" height="140" rx="10" fill="#FFFFFF" stroke="#C4722A" stroke-width="2" filter="url(#dfShadow)"/>
  <rect x="384" y="650" width="280" height="26" rx="10" fill="url(#dfOrange)"/>
  <rect x="384" y="667" width="280" height="9" fill="#E0631A"/>
  <text x="524" y="668" text-anchor="middle" class="hd">eBay Fulfillment API</text>
  <text x="400" y="698" class="sub mono">GET /sell/fulfillment/v1/order</text>
  <text x="400" y="719" class="sub">Paginated order fetch</text>
  <text x="400" y="740" class="sub">via eBay adapter</text>
  <path d="M664 720 L692 720" fill="none" stroke="#4A4742" stroke-width="2" marker-end="url(#dfArrow)"/>

  <!-- 3.3 persist -->
  <rect x="704" y="650" width="280" height="140" rx="10" fill="#FFFFFF" stroke="#2D2A26" stroke-width="2" filter="url(#dfShadow)"/>
  <rect x="704" y="650" width="280" height="26" rx="10" fill="url(#dfInk)"/>
  <rect x="704" y="667" width="280" height="9" fill="#2D2A26"/>
  <text x="844" y="668" text-anchor="middle" class="hd">Persist</text>
  <text x="720" y="698" class="sub">Orders rows in Postgres</text>
  <text x="720" y="719" class="sub mono">orders.shippingAddress (JSONB)</text>
  <text x="720" y="740" class="sub">Cancel state → fulfillmentStatus</text>
  <path d="M984 720 L1012 720" fill="none" stroke="#4A4742" stroke-width="2" marker-end="url(#dfArrow)"/>

  <!-- 3.4 ship -->
  <rect x="1024" y="650" width="280" height="140" rx="10" fill="#FFFFFF" stroke="#C4722A" stroke-width="2" filter="url(#dfShadow)"/>
  <rect x="1024" y="650" width="280" height="26" rx="10" fill="url(#dfOrange)"/>
  <rect x="1024" y="667" width="280" height="9" fill="#E0631A"/>
  <text x="1164" y="668" text-anchor="middle" class="hd">Ship-It → eBay</text>
  <text x="1040" y="698" class="sub mono">ebay.com/itm/{ebayItemId}</text>
  <text x="1040" y="719" class="sub">Label purchased on eBay —</text>
  <text x="1040" y="740" class="sub">no carrier API (decision 2026-07)</text>

  <!-- ════════ FLOW 4 — AUTH ════════ -->
  <rect x="40" y="852" width="1280" height="220" rx="12" fill="#EFEBE2" stroke="#D6D3CE" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="60" y="878" class="flow">FLOW 4 — AUTH (Cloudflare Access → internal JWT)</text>

  <!-- 4.1 browser -->
  <rect x="64" y="902" width="216" height="140" rx="10" fill="#FFFFFF" stroke="#C4722A" stroke-width="2" filter="url(#dfShadow)"/>
  <rect x="64" y="902" width="216" height="26" rx="10" fill="url(#dfOrange)"/>
  <rect x="64" y="919" width="216" height="9" fill="#E0631A"/>
  <text x="172" y="920" text-anchor="middle" class="hd">Browser</text>
  <text x="80" y="950" class="sub">Login at CF Access edge</text>
  <text x="80" y="971" class="sub">No passwords</text>
  <path d="M280 972 L308 972" fill="none" stroke="#4A4742" stroke-width="2" marker-end="url(#dfArrow)"/>

  <!-- 4.2 header -->
  <rect x="320" y="902" width="216" height="140" rx="10" fill="#FFFFFF" stroke="#C4722A" stroke-width="2" filter="url(#dfShadow)"/>
  <rect x="320" y="902" width="216" height="26" rx="10" fill="url(#dfOrange)"/>
  <rect x="320" y="919" width="216" height="9" fill="#E0631A"/>
  <text x="428" y="920" text-anchor="middle" class="hd">CF Access assertion</text>
  <text x="336" y="950" class="sub mono">Cf-Access-Jwt-Assertion</text>
  <text x="336" y="971" class="sub">header injected at the edge</text>
  <path d="M536 972 L564 972" fill="none" stroke="#4A4742" stroke-width="2" marker-end="url(#dfArrow)"/>

  <!-- 4.3 verify -->
  <rect x="576" y="902" width="216" height="140" rx="10" fill="#FFFFFF" stroke="#0D7377" stroke-width="2" filter="url(#dfShadow)"/>
  <rect x="576" y="902" width="216" height="26" rx="10" fill="url(#dfTeal)"/>
  <rect x="576" y="919" width="216" height="9" fill="#0A5A5D"/>
  <text x="684" y="920" text-anchor="middle" class="hd">GET /auth/session</text>
  <text x="592" y="950" class="sub">Verify vs team JWKS</text>
  <text x="592" y="971" class="sub mono">/cdn-cgi/access/certs</text>
  <text x="592" y="992" class="sub">(jose, lib/cf-access.ts)</text>
  <path d="M792 972 L820 972" fill="none" stroke="#4A4742" stroke-width="2" marker-end="url(#dfArrow)"/>

  <!-- 4.4 provision + mint -->
  <rect x="832" y="902" width="216" height="140" rx="10" fill="#FFFFFF" stroke="#0D7377" stroke-width="2" filter="url(#dfShadow)"/>
  <rect x="832" y="902" width="216" height="26" rx="10" fill="url(#dfTeal)"/>
  <rect x="832" y="919" width="216" height="9" fill="#0A5A5D"/>
  <text x="940" y="920" text-anchor="middle" class="hd">Provision + mint</text>
  <text x="848" y="950" class="sub">Auto-provision users row</text>
  <text x="848" y="971" class="sub">on first login</text>
  <text x="848" y="992" class="sub">Mint internal JWT — 15 m</text>
  <text x="848" y="1013" class="sub">(lib/jwt.ts)</text>
  <path d="M1048 972 L1076 972" fill="none" stroke="#4A4742" stroke-width="2" marker-end="url(#dfArrow)"/>

  <!-- 4.5 re-exchange -->
  <rect x="1088" y="902" width="216" height="140" rx="10" fill="#FFFFFF" stroke="#2D2A26" stroke-width="2" filter="url(#dfShadow)"/>
  <rect x="1088" y="902" width="216" height="26" rx="10" fill="url(#dfInk)"/>
  <rect x="1088" y="919" width="216" height="9" fill="#2D2A26"/>
  <text x="1196" y="920" text-anchor="middle" class="hd">Re-exchange on expiry</text>
  <text x="1104" y="950" class="sub">On 401 the client calls</text>
  <text x="1104" y="971" class="sub mono">GET /auth/session</text>
  <text x="1104" y="992" class="sub">again — no refresh tokens</text>

  <!-- Footnote -->
  <text x="48" y="1112" class="sub" font-size="12">All API calls carry the internal JWT · Marketplace tokens AES-256-GCM at rest · Etsy parked 2026-07 — no Etsy flow</text>
</svg>

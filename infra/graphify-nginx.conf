# Serves the generated code knowledge graph (graphify-out/) read-only.
# graph.html is the interactive dashboard; autoindex lets the report and
# raw graph.json be browsed directly. LAN-only via the published port.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index graph.html;
    # Emit relative Location headers — absolute ones drop the :8018 port
    # (host-header rebuild, same trap as the :8017 docs redirects).
    absolute_redirect off;

    # Landing page is the explorer (Stephen go, 2026-07-17); the raw
    # vis-network dashboard stays reachable at /graph.html.
    location = / {
        return 302 /explore/;
    }

    location / {
        try_files $uri $uri/ =404;
        autoindex on;
    }

    # Stack portal (interactive resource hub) — lives outside graphify-out so
    # graph rebuilds can never clobber it. Mounted at /srv/portal.
    location /portal/ {
        alias /srv/portal/;
        index index.html;
    }

    # Markdown (wiki articles, GRAPH_REPORT.md) must display in the browser,
    # not download — nginx has no default MIME mapping for .md.
    location ~* \.md$ {
        types {}
        default_type "text/plain; charset=utf-8";
    }
}

# Serves the generated code knowledge graph (graphify-out/) read-only.
# graph.html is the interactive dashboard; autoindex lets the report and
# raw graph.json be browsed directly. LAN-only via the published port.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index graph.html;

    location / {
        try_files $uri $uri/ =404;
        autoindex on;
    }

    # Stack portal (interactive resource hub) — lives outside graphify-out so
    # graph rebuilds can never clobber it. Mounted at /srv/portal.
    location /portal/ {
        alias /srv/portal/;
        index index.html;
    }

    # Markdown (wiki articles, GRAPH_REPORT.md) must display in the browser,
    # not download — nginx has no default MIME mapping for .md.
    location ~* \.md$ {
        types {}
        default_type "text/plain; charset=utf-8";
    }
}
